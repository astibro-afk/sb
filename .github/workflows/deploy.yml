name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, json
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Check JavaScript syntax
        run: |
          node --check service-worker.js
          node --check third_party/qrcodejs/qrcode.min.js
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          for name in ("push.php", "index.html", "notifications.php", "documents.php", "incidents.php", "damage.php", "settings.php"):
              source = pathlib.Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", source, re.I | re.S)
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = pathlib.Path(tempfile.gettempdir()) / f"sb-{pathlib.Path(name).stem}-{index}.js"
                  path.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          PY

      - name: Upload site to InfinityFree
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            **/config.php
            **/config.local.php
            **/config.local.php.example
